<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHU Support AI -- Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="login-wrapper">

        <!-- Chap tomon: rasm + brend -->
        <div class="login-left">
            <div class="brand-logo">
                <img src="assets/images/schuuniver.png" alt="SCH Logo">
                <span>SOON CHUN HYANG <br>UNIVERSITY</span>
            </div>

            <h1 class="hero-title">SCHU<br>SUPPORT AI</h1>
            <p class="hero-sub">AI Assistant for International Students<br>at Soonchunhyang University</p>

            <div class="lang-select-select">
                <i class="fa-solid fa-globe"></i> English <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>

        <!-- O'ng tomon: login forma -->
        <div class="login-right">
            <div class="login-box">
                <h2>Welcome Back!</h2>
                <p class="subtitle">Login to continue to your account</p>

                <div class="login-tabs">
                    <button type="button" class="tab-btn active" data-role="student">Student Login</button>
                    <button type="button" class="tab-btn" data-role="admin">Admin Login</button>
                </div>

                <form id="loginForm">
                    <label for="loginId" id="idLabel">Student ID</label>
                    <div class="input-icon">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="loginId" placeholder="Enter your student ID" required>
                    </div>

                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fa-regular fa-eye toggle-eye" id="togglePassword"></i>
                    </div>

                    <div class="form-row">
                        <label class="remember">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>

                <div class="signup-row" id="signupRow">
                    <p>New international student?</p>
                    <a href="#" class="btn-create">Create Account</a>
                </div>
            </div>
        </div>

    </div>

    <footer class="login-footer">
        © 2026 Soonchunhyang University. All rights reserved.
    </footer>

    <script src="assets/js/auth.js"></script>
</body>
</html>
